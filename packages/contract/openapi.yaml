# Generated by `npm run openapi -w @deep-reef/contract` from packages/contract/src.
# Do not edit by hand: change the schemas and regenerate.
openapi: 3.1.0
info:
  title: Deep Reef Game Server API
  version: 1.0.0
  description: Server side of the Deep Reef slot. Outcomes are computed entirely on the server; clients only display them. Spins are idempotent by requestId. Errors use RFC 9457 problem details with a stable `code`. Generated from packages/contract/src/schemas.ts; do not edit by hand.
servers:
  - url: /
    description: Same origin as the API host
tags:
  - name: sessions
    description: Anonymous demo sessions and their wallet
  - name: spins
    description: Game rounds
  - name: health
    description: Liveness
paths:
  /v1/sessions:
    post:
      operationId: createSession
      tags:
        - sessions
      summary: Create an anonymous demo session
      description: Opens a session with the starting balance and returns the game configuration.
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "429":
          $ref: "#/components/responses/RATE_LIMITED"
        "500":
          $ref: "#/components/responses/INTERNAL_ERROR"
        "503":
          $ref: "#/components/responses/SERVICE_UNAVAILABLE"
  /v1/sessions/{sessionId}:
    get:
      operationId: getSession
      tags:
        - sessions
      summary: Get a session (balance and game configuration)
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Session identifier returned by createSession.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "The session: balance and game configuration."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/VALIDATION_ERROR"
        "404":
          $ref: "#/components/responses/SESSION_NOT_FOUND"
        "429":
          $ref: "#/components/responses/RATE_LIMITED"
        "500":
          $ref: "#/components/responses/INTERNAL_ERROR"
  /v1/sessions/{sessionId}/spins:
    post:
      operationId: spin
      tags:
        - spins
      summary: Play one round
      description: "Debits the bet, plays the complete round (free spins included) and credits the win in one atomic step. Repeating a request with the same requestId returns the stored result with `replayed: true` and does not charge again; reusing a requestId with a different bet fails with IDEMPOTENCY_CONFLICT. Status 422 covers INVALID_BET and INSUFFICIENT_FUNDS; the `code` tells them apart."
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Session identifier returned by createSession.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpinRequest"
      responses:
        "200":
          description: Round result (new or replayed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpinResponse"
        "400":
          $ref: "#/components/responses/VALIDATION_ERROR"
        "404":
          $ref: "#/components/responses/SESSION_NOT_FOUND"
        "409":
          $ref: "#/components/responses/IDEMPOTENCY_CONFLICT"
        "422":
          description: "One of: INVALID_BET (Bet is not an allowed bet level); INSUFFICIENT_FUNDS (Balance is lower than the bet)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RATE_LIMITED"
        "500":
          $ref: "#/components/responses/INTERNAL_ERROR"
        "503":
          $ref: "#/components/responses/SERVICE_UNAVAILABLE"
  /health:
    get:
      operationId: health
      tags:
        - health
      summary: Liveness check
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  schemas:
    Position:
      type: object
      required:
        - reel
        - row
      properties:
        reel:
          type: integer
          minimum: 0
          description: 0-based reel (column).
        row:
          type: integer
          minimum: 0
          description: 0-based row, top = 0.
      additionalProperties: false
      title: Position
    PayEntry:
      type: object
      required:
        - count
        - multiplier
      properties:
        count:
          type: integer
          minimum: 1
        multiplier:
          type: integer
          minimum: 0
      additionalProperties: false
      title: PayEntry
    SymbolPays:
      type: object
      required:
        - symbol
        - pays
      properties:
        symbol:
          type: string
          minLength: 1
          description: Symbol identifier, e.g. "SHARK".
        pays:
          type: array
          items:
            $ref: "#/components/schemas/PayEntry"
          description: Multiples of the line bet.
      additionalProperties: false
      title: SymbolPays
    GameConfig:
      type: object
      required:
        - gameId
        - reels
        - rows
        - symbols
        - wild
        - scatter
        - paylines
        - betLevels
        - linePays
        - scatterPays
        - freeSpins
        - maxWinMultiplier
        - wildReels
        - rtp
      properties:
        gameId:
          type: string
        reels:
          type: integer
          minimum: 1
        rows:
          type: integer
          minimum: 1
        symbols:
          type: array
          items:
            type: string
            minLength: 1
            description: Symbol identifier, e.g. "SHARK".
        wild:
          type: string
          minLength: 1
          description: Symbol identifier, e.g. "SHARK".
        scatter:
          type: string
          minLength: 1
          description: Symbol identifier, e.g. "SHARK".
        paylines:
          type: array
          items:
            type: array
            items:
              type: integer
              minimum: 0
          description: Row index per reel for each payline.
        betLevels:
          type: array
          items:
            type: integer
            minimum: 0
            description: Amount in credits (integer).
          minItems: 1
          description: Allowed total bets.
        linePays:
          type: array
          items:
            $ref: "#/components/schemas/SymbolPays"
        scatterPays:
          type: array
          items:
            $ref: "#/components/schemas/PayEntry"
          description: Multiples of the total bet.
        freeSpins:
          type: object
          required:
            - triggerCount
            - awarded
            - retriggerAwarded
            - maxTotal
            - winMultiplier
          properties:
            triggerCount:
              type: integer
              minimum: 1
            awarded:
              type: integer
              minimum: 1
            retriggerAwarded:
              type: integer
              minimum: 0
            maxTotal:
              type: integer
              minimum: 1
              description: Most free spins one feature can award, retriggers included.
            winMultiplier:
              type: integer
              minimum: 1
          additionalProperties: false
        maxWinMultiplier:
          type: integer
          minimum: 1
          description: Round win cap as a multiple of total bet.
        wildReels:
          type: array
          items:
            type: integer
            minimum: 0
          description: 0-based reels on which the wild can appear.
        rtp:
          type: number
          exclusiveMinimum: 0
          maximum: 1
          description: Theoretical return to player, e.g. 0.956.
      additionalProperties: false
      title: GameConfig
    Session:
      type: object
      required:
        - sessionId
        - balance
        - config
      properties:
        sessionId:
          type: string
          format: uuid
          description: RFC 4122 UUID.
        balance:
          type: integer
          minimum: 0
          description: Amount in credits (integer).
        config:
          $ref: "#/components/schemas/GameConfig"
      additionalProperties: false
      title: Session
    SpinRequest:
      type: object
      required:
        - requestId
        - bet
      properties:
        requestId:
          type: string
          format: uuid
          description: Idempotency key chosen by the client, unique per spin. Retrying with the same key returns the original result and never charges twice.
        bet:
          type: integer
          minimum: 1
          description: Total bet in credits; must be one of GameConfig.betLevels.
      additionalProperties: false
      title: SpinRequest
    LineWin:
      type: object
      required:
        - line
        - symbol
        - count
        - positions
        - win
      properties:
        line:
          type: integer
          minimum: 0
          description: 0-based payline index.
        symbol:
          type: string
          minLength: 1
          description: Symbol identifier, e.g. "SHARK".
        count:
          type: integer
          minimum: 1
        positions:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        win:
          type: integer
          minimum: 0
          description: Amount in credits (integer).
      additionalProperties: false
      title: LineWin
    ScatterWin:
      type: object
      required:
        - count
        - positions
        - win
        - freeSpinsAwarded
      properties:
        count:
          type: integer
          minimum: 1
        positions:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        win:
          type: integer
          minimum: 0
          description: Amount in credits (integer).
        freeSpinsAwarded:
          type: integer
          minimum: 0
      additionalProperties: false
      title: ScatterWin
    SpinOutcome:
      type: object
      required:
        - stops
        - grid
        - lineWins
        - scatter
        - multiplier
        - win
        - capped
      properties:
        stops:
          type: array
          items:
            type: integer
            minimum: 0
          description: Top visible strip index per reel.
        grid:
          type: array
          items:
            type: array
            items:
              type: string
              minLength: 1
              description: Symbol identifier, e.g. "SHARK".
          description: Visible symbols, grid[reel][row].
        lineWins:
          type: array
          items:
            $ref: "#/components/schemas/LineWin"
        scatter:
          anyOf:
            - $ref: "#/components/schemas/ScatterWin"
            - type: "null"
        multiplier:
          type: integer
          minimum: 1
        win:
          type: integer
          minimum: 0
          description: Amount in credits (integer).
        capped:
          type: boolean
          description: True when the round cap reduced this spin’s win.
      additionalProperties: false
      title: SpinOutcome
    FreeSpinsOutcome:
      type: object
      required:
        - awarded
        - retriggers
        - spins
        - totalWin
      properties:
        awarded:
          type: integer
          minimum: 1
        retriggers:
          type: integer
          minimum: 0
        spins:
          type: array
          items:
            $ref: "#/components/schemas/SpinOutcome"
        totalWin:
          type: integer
          minimum: 0
          description: Amount in credits (integer).
      additionalProperties: false
      title: FreeSpinsOutcome
    Round:
      type: object
      required:
        - base
        - freeSpins
        - totalWin
        - maxWinReached
      properties:
        base:
          $ref: "#/components/schemas/SpinOutcome"
        freeSpins:
          anyOf:
            - $ref: "#/components/schemas/FreeSpinsOutcome"
            - type: "null"
        totalWin:
          type: integer
          minimum: 0
          description: Amount in credits (integer).
        maxWinReached:
          type: boolean
      additionalProperties: false
      title: Round
    SpinResponse:
      type: object
      required:
        - requestId
        - roundId
        - bet
        - win
        - balanceBefore
        - balanceAfter
        - replayed
        - round
      properties:
        requestId:
          type: string
          format: uuid
          description: RFC 4122 UUID.
        roundId:
          type: string
          format: uuid
          description: RFC 4122 UUID.
        bet:
          type: integer
          minimum: 0
          description: Amount in credits (integer).
        win:
          type: integer
          minimum: 0
          description: Amount in credits (integer).
        balanceBefore:
          type: integer
          minimum: 0
          description: Amount in credits (integer).
        balanceAfter:
          type: integer
          minimum: 0
          description: Amount in credits (integer).
        replayed:
          type: boolean
          description: True when this is the stored result of an earlier request with the same requestId.
        round:
          $ref: "#/components/schemas/Round"
      additionalProperties: false
      title: SpinResponse
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: ok
      additionalProperties: false
      title: HealthResponse
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          description: URI reference identifying the problem type.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          enum:
            - VALIDATION_ERROR
            - SESSION_NOT_FOUND
            - IDEMPOTENCY_CONFLICT
            - INVALID_BET
            - INSUFFICIENT_FUNDS
            - RATE_LIMITED
            - INTERNAL_ERROR
            - SERVICE_UNAVAILABLE
          description: Stable machine-readable error code.
        detail:
          type: string
        requestId:
          type: string
          description: The spin requestId, when the error concerns one.
      title: Problem
      description: RFC 9457 problem details (application/problem+json).
  responses:
    VALIDATION_ERROR:
      description: Request validation failed (code VALIDATION_ERROR).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    SESSION_NOT_FOUND:
      description: Session not found (code SESSION_NOT_FOUND).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    IDEMPOTENCY_CONFLICT:
      description: requestId was already used with a different request (code IDEMPOTENCY_CONFLICT).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RATE_LIMITED:
      description: Too many requests (code RATE_LIMITED).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    INTERNAL_ERROR:
      description: Internal server error (code INTERNAL_ERROR).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    SERVICE_UNAVAILABLE:
      description: Service temporarily unavailable (code SERVICE_UNAVAILABLE).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
