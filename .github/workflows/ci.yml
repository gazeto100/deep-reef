name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, API lint, verify, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (ESLint + layer boundaries, Prettier)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Lint OpenAPI spec
        run: npm run api:lint

      - name: Verify math invariants
        run: npm run math:verify

      - name: Build
        run: npm run build
